name: Release Mod

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Native TSF DLL
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File native/tip/build.ps1 -Configuration Release

      - name: Download official 1.3.0 release
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/yksr-melt/Meltype/releases/download/v1.3.0/Meltype-1.3.0-windows.zip" -OutFile official.zip
          Expand-Archive official.zip -DestinationPath stage_official\Meltype

      - name: Build Meltype 1.3.0-mod10
        shell: pwsh
        run: |
          dotnet publish src/Meltype/Meltype.csproj -c Release -p:Version="1.3.0-mod10" -o stage_build

      - name: Assemble Package with New DLLs and clean hashes
        shell: pwsh
        run: |
          Copy-Item stage_build/* stage_official/Meltype/app/ -Force
          Copy-Item native/tip/bin/x64/MeltypeTip.dll stage_official/Meltype/app/tip/x64/ -Force
          Copy-Item native/tip/bin/x64/MeltypeTip.dll.sha256 stage_official/Meltype/app/tip/x64/ -Force
          Copy-Item native/tip/bin/x86/MeltypeTip.dll stage_official/Meltype/app/tip/x86/ -Force
          Copy-Item native/tip/bin/x86/MeltypeTip.dll.sha256 stage_official/Meltype/app/tip/x86/ -Force

          # 今回ビルドした最新 DLL のハッシュを計算し、.package.sha256 として発行・同梱する
          # これにより、ユーザー環境に古い .package.sha256 があっても確実に上書きされる
          foreach ($arch in @('x64', 'x86')) {
              $dll = "stage_official/Meltype/app/tip/$arch/MeltypeTip.dll"
              $sha = [System.Security.Cryptography.SHA256]::Create()
              try { $hash = [BitConverter]::ToString($sha.ComputeHash([IO.File]::ReadAllBytes($dll))).Replace('-', '') } finally { $sha.Dispose() }
              [IO.File]::WriteAllText("$dll.package.sha256", $hash)
              Write-Host "Generated $dll.package.sha256 = $hash"
          }

      - name: Build Installer and Zip
        shell: pwsh
        run: |
          $iscc = .\packaging\Find-InnoSetup.ps1
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $iscc /Q "/DAppVersion=1.3.0-mod10" "/DSourceDir=$PWD\stage_official\Meltype" "/DOutputDir=$PWD\dist" packaging\Meltype.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          Compress-Archive -Path stage_official/Meltype/* -DestinationPath dist/Meltype-1.3.0-mod10-windows.zip -Force

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Meltype 1.3.0-mod10
          body: |
            Meltype 1.3.0-mod10 (最新PR反映版: ネイティブDLL完全再ビルド・パッケージハッシュ検証自動更新・数字後の消去境界リセット・数字の直後のto半角ロック解消・中黒モードでのルートパス保護・中黒優先・TSF状態リセット・PR #662統合 mod)

            ### ダウンロード
            - **インストーラー版 (推奨)**: [Meltype-1.3.0-mod10-setup.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Meltype-1.3.0-mod10-setup.exe)
            - **Zip 版**: [Meltype-1.3.0-mod10-windows.zip](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Meltype-1.3.0-mod10-windows.zip)
          files: |
            dist/Meltype-1.3.0-mod10-setup.exe
            dist/Meltype-1.3.0-mod10-windows.zip
