name: Release Mod

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download official 1.3.0 release
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/yksr-melt/Meltype/releases/download/v1.3.0/Meltype-1.3.0-windows.zip" -OutFile official.zip
          Expand-Archive official.zip -DestinationPath stage_official\Meltype

      - name: Build Meltype 1.3.0-mod6
        shell: pwsh
        run: |
          dotnet publish src/Meltype/Meltype.csproj -c Release -p:Version="1.3.0-mod6" -o stage_build
          Copy-Item stage_build/* stage_official/Meltype/app/ -Force

      - name: Build Installer and Zip
        shell: pwsh
        run: |
          $iscc = .\packaging\Find-InnoSetup.ps1
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $iscc /Q "/DAppVersion=1.3.0-mod6" "/DSourceDir=$PWD\stage_official\Meltype" "/DOutputDir=$PWD\dist" packaging\Meltype.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          Compress-Archive -Path stage_official/Meltype/* -DestinationPath dist/Meltype-1.3.0-mod6-windows.zip -Force

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Meltype 1.3.0-mod6
          body: |
            Meltype 1.3.0-mod6 (最新PR反映版: 数字の直後のto半角ロック解消・中黒モードでのルートパス保護・中黒優先・TSF状態リセット・PR #662統合 mod)

            ### ダウンロード
            - **インストーラー版 (推奨)**: [Meltype-1.3.0-mod6-setup.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Meltype-1.3.0-mod6-setup.exe)
            - **Zip 版**: [Meltype-1.3.0-mod6-windows.zip](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Meltype-1.3.0-mod6-windows.zip)
          files: |
            dist/Meltype-1.3.0-mod6-setup.exe
            dist/Meltype-1.3.0-mod6-windows.zip
