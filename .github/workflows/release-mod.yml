name: Release Mod

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Native TSF DLL
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File native/tip/build.ps1 -Configuration Release

      - name: Download official 1.4.1-pre.1 release
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/yksr-melt/Meltype/releases/download/v1.4.1-pre.1/Meltype-1.4.1-pre.1-windows.zip" -OutFile official.zip
          Expand-Archive official.zip -DestinationPath stage_official\Meltype

      - name: Resolve Version
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if (-not $ver) { $ver = "1.4.1-mod1" }
          "MOD_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "MOD_VERSION=$ver"

      - name: Build Meltype
        shell: pwsh
        run: |
          dotnet publish src/Meltype/Meltype.csproj -c Release -p:Version="$env:MOD_VERSION" -o stage_build

      - name: Assemble Package with New DLLs and clean hashes
        shell: pwsh
        run: |
          Copy-Item stage_build/* stage_official/Meltype/app/ -Force
          Copy-Item native/tip/bin/x64/MeltypeTip.dll stage_official/Meltype/app/tip/x64/ -Force
          Copy-Item native/tip/bin/x64/MeltypeTip.dll.sha256 stage_official/Meltype/app/tip/x64/ -Force
          Copy-Item native/tip/bin/x86/MeltypeTip.dll stage_official/Meltype/app/tip/x86/ -Force
          Copy-Item native/tip/bin/x86/MeltypeTip.dll.sha256 stage_official/Meltype/app/tip/x86/ -Force

          # 今回ビルドした最新 DLL のハッシュを計算し、.package.sha256 として発行・同梱する
          # これにより、ユーザー環境に古い .package.sha256 があっても確実に上書きされる
          foreach ($arch in @('x64', 'x86')) {
              $dll = "stage_official/Meltype/app/tip/$arch/MeltypeTip.dll"
              $sha = [System.Security.Cryptography.SHA256]::Create()
              try { $hash = [BitConverter]::ToString($sha.ComputeHash([IO.File]::ReadAllBytes($dll))).Replace('-', '') } finally { $sha.Dispose() }
              [IO.File]::WriteAllText("$dll.package.sha256", $hash)
              Write-Host "Generated $dll.package.sha256 = $hash"
          }

      - name: Build Installer and Zip
        shell: pwsh
        run: |
          $ver = $env:MOD_VERSION
          $iscc = .\packaging\Find-InnoSetup.ps1
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $iscc /Q "/DAppVersion=$ver" "/DSourceDir=$PWD\stage_official\Meltype" "/DOutputDir=$PWD\dist" packaging\Meltype.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          Compress-Archive -Path stage_official/Meltype/* -DestinationPath "dist/Meltype-$ver-windows.zip" -Force

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Meltype ${{ env.MOD_VERSION }}
          body: |
            Meltype ${{ env.MOD_VERSION }} (最新修正版: 英文脈・数字後のスラッシュ強制半角化防止・中黒優先反映・空欄境界判定・ネイティブDLL更新)

            ### ダウンロード
            - **インストーラー版 (推奨)**: [Meltype-${{ env.MOD_VERSION }}-setup.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Meltype-${{ env.MOD_VERSION }}-setup.exe)
            - **Zip 版**: [Meltype-${{ env.MOD_VERSION }}-windows.zip](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Meltype-${{ env.MOD_VERSION }}-windows.zip)
          files: |
            dist/Meltype-*-setup.exe
            dist/Meltype-*-windows.zip
